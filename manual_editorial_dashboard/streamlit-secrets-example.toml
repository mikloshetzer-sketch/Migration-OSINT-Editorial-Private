# Copy values into your hosting provider's encrypted Streamlit secrets.
# Never commit real client secrets or tokens.
[auth]
redirect_uri = "https://YOUR-PRIVATE-APP.example.com/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_LONG_SECRET"

[auth.google]
client_id = "GOOGLE_OAUTH_CLIENT_ID"
client_secret = "GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
